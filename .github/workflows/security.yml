name: Security Scan

on:
  pull_request:
    branches: [ main ]
    paths:
      - '**/pom.xml'
      - '**/src/**'
      - '.github/workflows/security.yml'
      - '.github/dependency-review-config.yml'
      - 'scripts/check-hardcoded-secrets*'
  schedule:
    # Run weekly on Sunday at 2 AM UTC
    - cron: '0 2 * * 0'
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      full_scan:
        description: 'Run full security scan (including CodeQL)'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up JDK 21
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

    # Keep each check separate so an error cannot be hidden by a later command.
    - name: SpotBugs security analysis
      id: spotbugs
      run: mvn -B compile spotbugs:check -Dspotbugs.effort=Max -Dspotbugs.threshold=Medium

    - name: Test credential scanner
      id: scanner-tests
      run: bash scripts/check-hardcoded-secrets.test.sh

    - name: Check potential hardcoded credential literals
      id: secrets
      run: bash scripts/check-hardcoded-secrets.sh

    - name: Analyze Maven dependencies
      id: dependencies
      run: mvn -B dependency:analyze

    # Dependency vulnerability scanning using GitHub Security
    - name: Dependency Review
      id: review
      if: github.event_name == 'pull_request'
      uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      with:
        # Use config file for vulnerability exceptions
        config-file: '.github/dependency-review-config.yml'

    # CodeQL Analysis - only for scheduled runs or manual triggers
    - name: Initialize CodeQL
      if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.full_scan == 'true')
      uses: github/codeql-action/init@c10b8064de6f491fea524254123dbe5e09572f13 # v4
      with:
        languages: java
        queries: security-and-quality

    - name: Build for CodeQL
      if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.full_scan == 'true')
      run: mvn clean compile -DskipTests -q

    - name: Perform CodeQL Analysis
      id: codeql
      if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.full_scan == 'true')
      uses: github/codeql-action/analyze@c10b8064de6f491fea524254123dbe5e09572f13 # v4

    - name: Security Scan Summary
      if: always()
      run: |
        {
          echo "## Security Scan Results"
          echo ""
          echo "Trigger: ${{ github.event_name }}"
          echo ""
          echo "| Check | Outcome |"
          echo "| --- | --- |"
          echo "| SpotBugs security analysis | ${{ steps.spotbugs.outcome }} |"
          echo "| Credential scanner fixtures | ${{ steps.scanner-tests.outcome }} |"
          echo "| Potential credential literals | ${{ steps.secrets.outcome }} |"
          echo "| Maven dependency analysis | ${{ steps.dependencies.outcome }} |"
          echo "| Dependency vulnerability review (pull requests) | ${{ steps.review.outcome }} |"
          echo "| CodeQL analysis (scheduled/full scans) | ${{ steps.codeql.outcome }} |"
        } >> "$GITHUB_STEP_SUMMARY"
