name: Run Tests

on:
  push:
    branches: [ main, 'renovate/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up JDK 21
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    # JaCoCo report and coverage checks are bound to the test phase in the parent POM.
    - name: Run tests with coverage
      run: mvn -B clean test -Dsurefire.printSummary=true

    - name: Generate test report
      id: test-report
      uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
      if: always()
      continue-on-error: true
      with:
        name: Maven Tests
        path: "**/target/surefire-reports/TEST-*.xml"
        reporter: java-junit
        fail-on-error: false

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
      if: success() || failure()
      with:
        # Codecov discovers JaCoCo reports recursively across the runtime and library modules.
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Comment coverage on PR
      uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
      if: github.event_name == 'pull_request'
      with:
        paths: "**/target/site/jacoco/jacoco.xml"
        token: ${{ secrets.GITHUB_TOKEN }}
        min-coverage-overall: 70
        min-coverage-changed-files: 70
        title: 📊 Test Coverage Report
        update-comment: true

    - name: Upload test results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      if: always()
      with:
        name: test-results
        path: |
          **/target/surefire-reports/
          **/target/site/jacoco/
        retention-days: 7
